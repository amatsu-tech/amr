name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Новый пуш в PR отменяет устаревшую проверку. Когда CI вызван из release.yml
# (событие push), ничего не отменяется — этим управляет сам release.yml.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files are not formatted, run 'task fmt':"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod and go.sum
        run: |
          if ! go mod tidy -diff; then
            echo "::error::go.mod or go.sum is not tidy, run 'task tidy'"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go tool gotestsum --format pkgname -- -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage.out ] || exit 0
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')
          {
            echo "## Test coverage: ${total}"
            echo
            echo "<details><summary>By function</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
