name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go tool gotestsum --format pkgname -- -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage.out ] || exit 0
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')
          {
            echo "## Test coverage: ${total}"
            echo
            echo "<details><summary>By function</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
