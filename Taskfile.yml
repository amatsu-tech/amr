version: "3"

vars:
  APP_NAME: amr
  BUILD_DIR: build

tasks:
  run:
    desc: Run application
    cmds:
      - go run ./cmd/amr {{.CLI_ARGS}}

  build:
    desc: Build application
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -o {{.BUILD_DIR}}/{{.APP_NAME}} ./cmd/amr

  start:
    desc: Run built binary
    deps:
      - build
    cmds:
      - ./{{.BUILD_DIR}}/{{.APP_NAME}} {{.CLI_ARGS}}

  test:
    desc: Run tests (one line per package)
    cmds:
      - go tool gotestsum --format pkgname -- -race -cover ./... {{.CLI_ARGS}}

  test:verbose:
    desc: Run tests (one line per test)
    cmds:
      - go tool gotestsum --format testname -- -race -cover ./... {{.CLI_ARGS}}

  cover:
    desc: Open test coverage report in the browser
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  bench:
    desc: Run benchmarks and show time per call in milliseconds (the previous run is kept for bench:compare)
    silent: true
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - if [ -f {{.BUILD_DIR}}/bench.txt ]; then mv {{.BUILD_DIR}}/bench.txt {{.BUILD_DIR}}/bench.old.txt; fi
      - echo "Running benchmarks..."
      - go test ./... -run='^$' -bench=. -benchmem -count=6 -benchtime=200ms {{.CLI_ARGS}} > {{.BUILD_DIR}}/bench.txt
      - go run ./internal/tools/benchtable {{.BUILD_DIR}}/bench.txt

  bench:compare:
    desc: Compare time per call between the last two benchmark runs
    silent: true
    cmds:
      - go run ./internal/tools/benchtable {{.BUILD_DIR}}/bench.old.txt {{.BUILD_DIR}}/bench.txt

  bench:full:
    desc: Show the last benchmark run with time, memory and allocations
    cmds:
      - go tool benchstat current={{.BUILD_DIR}}/bench.txt

  fmt:
    desc: Format code
    cmds:
      - gofmt -w .

  tidy:
    desc: Tidy dependencies
    cmds:
      - go mod tidy

  check:
    desc: Run all quality checks
    deps:
      - fmt
      - tidy
      - build
      - test
