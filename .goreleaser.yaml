version: 2

project_name: amr

before:
  hooks:
    - go mod tidy

builds:
  - id: amr
    main: ./cmd/amr
    binary: amr
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/amatsu-tech/amr/internal/cli.version={{ .Tag }}
      - -X github.com/amatsu-tech/amr/internal/cli.commit={{ .ShortCommit }}

archives:
  - id: amr
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]

checksum:
  name_template: "checksums.txt"

release:
  # Release уже создан release-please вместе с текстом, сюда только добавляем архивы.
  mode: keep-existing

changelog:
  disable: true
